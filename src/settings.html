<!doctype html>
<html lang="zh-CN" data-version="__VERSION__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Final Model · 设置</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
:root{color-scheme:light;--pink:#f386a1;--ink:#1e1e1e;--paper:#fefefe;--line:#dedede;--muted:#676767;--green:#037a44;--error:#a12538;--mono:ui-monospace,"SFMono-Regular",Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--pink);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{color:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.45}button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:5px}[hidden]{display:none!important}
.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink);padding:0 4.5vw;background:var(--paper)}.brand{display:flex;align-items:center;gap:13px;font-weight:600;font-size:21px;letter-spacing:-.7px}.brand-icon{display:block;flex:none}.topmeta{display:flex;gap:26px;align-items:center;font:13px var(--mono)}.topmeta span:first-child{letter-spacing:.12em}.version{color:var(--muted)}
main{max-width:1440px;margin:auto;display:grid;grid-template-columns:minmax(340px, .92fr) minmax(440px,1.08fr);min-height:calc(100svh - 76px)}.intro{position:relative;display:flex;flex-direction:column;padding:66px 12% 36px 14%;border-right:1px solid var(--ink);overflow:hidden}.eyebrow{display:flex;align-items:center;gap:8px;font:12px var(--mono);letter-spacing:.06em}.eyebrow::before{content:"";width:7px;height:7px;background:currentColor}.intro h2{font-size:clamp(38px,4.2vw,60px);font-weight:500;letter-spacing:-.06em;line-height:1.24;margin:32px 0 50px}.intro h2 span{display:block}.diagram{margin:auto 0 50px;position:relative;max-width:360px}.window{border:1px solid var(--ink);background:var(--pink);box-shadow:4px 4px 0 var(--ink);position:relative}.window-title{height:31px;padding:0 11px;border-bottom:1px solid var(--ink);display:flex;align-items:center;justify-content:space-between;font:12px var(--mono)}.window-title::after{content:"";width:9px;height:9px;border:1px solid currentColor}.window-body{padding:18px 19px 21px}.window-label{font-size:13px;margin-bottom:5px}.model-name{font-size:19px;font-weight:500;overflow-wrap:anywhere;line-height:1.4}.window.work{width:83%}.window.final{width:88%;margin-left:12%;background:var(--paper)}.window.final .window-title{background:var(--ink);color:var(--paper)}.connector{height:43px;width:1px;background:var(--ink);margin:0 0 0 49%;position:relative}.connector::after{content:"";position:absolute;bottom:1px;left:-4px;width:8px;height:8px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);transform:rotate(45deg)}.restore{display:flex;gap:9px;align-items:center;margin-top:24px;font-size:13px}.restore svg{width:17px;height:17px}.intro-foot{display:flex;justify-content:space-between;align-items:center;font:12px var(--mono);border-top:1px solid #1e1e1e55;padding-top:20px}.cross{font-size:22px;line-height:12px}
.settings{background:var(--paper);padding:62px clamp(30px,4.5vw,68px) 36px;display:flex;flex-direction:column}.heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:36px}.heading h1{margin:0;font-size:36px;font-weight:500;letter-spacing:-1.5px}.section-number{font:12px var(--mono);color:var(--muted)}.enable-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 0 26px;border-bottom:1px solid var(--ink)}.enable-row label{font-size:17px;cursor:pointer}.toggle-wrap{position:relative;flex:none;width:46px;height:26px}.toggle-wrap input{position:absolute;inset:0;margin:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:1}.toggle-track{display:block;width:46px;height:26px;border:1px solid var(--ink);background:#ededed;transition:background 140ms ease}.toggle-track::after{content:"";display:block;background:var(--ink);width:16px;height:16px;position:absolute;left:5px;top:5px;transition:transform 140ms ease}.toggle-wrap input:checked+.toggle-track{background:var(--pink)}.toggle-wrap input:checked+.toggle-track::after{transform:translateX(20px)}.toggle-wrap input:focus-visible+.toggle-track{outline:2px solid var(--ink);outline-offset:5px}.toggle-wrap input:disabled{cursor:default}.toggle-wrap:has(input:disabled){opacity:.4}
fieldset{padding:0;margin:28px 0 0;border:0;min-width:0}legend{padding:0;margin-bottom:17px;font-size:17px}.search{display:flex;align-items:center;border:1px solid var(--line);height:47px;padding:0 14px;gap:10px;margin-bottom:16px}.search:focus-within{border-color:var(--ink)}.search svg{width:17px;height:17px;flex:none}.search input{border:0;background:transparent;outline:none;width:100%;min-width:0;color:var(--ink);font-size:14px}.search input::placeholder{color:#777}.search input:focus-visible{outline:none}.models{max-height:350px;overflow:auto;scrollbar-width:thin;scrollbar-color:#bcbcbc transparent;padding:1px 4px 4px 1px;margin:0 -4px 0 -1px}.provider{margin:20px 0 8px;color:var(--muted);font:11px var(--mono);letter-spacing:.04em;overflow-wrap:anywhere}.provider:first-child{margin-top:2px}.model{position:relative;display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:17px 15px;margin-bottom:8px;cursor:pointer;min-height:77px;transition:background 140ms ease,border-color 140ms ease}.model.selected{border-color:var(--ink);background:#fdf1f4;box-shadow:2px 2px 0 var(--ink)}.model:hover{border-color:var(--ink)}.model input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}.model:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}.model-copy{min-width:0;flex:1}.model-title{display:block;font-size:16px;font-weight:500;overflow-wrap:anywhere}.model-id{display:block;font:11px/1.6 var(--mono);color:var(--muted);overflow-wrap:anywhere;margin-top:3px}.capacity{font:11px var(--mono);white-space:nowrap;color:var(--muted)}.radio{width:15px;height:15px;border:1px solid var(--ink);border-radius:50%;flex:none;display:grid;place-items:center}.selected .radio::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink)}.empty{border:1px dashed var(--line);padding:28px 20px;font-size:14px;line-height:1.8;color:var(--muted)}.empty strong{display:block;font-weight:500;color:var(--ink);margin-bottom:6px}.missing{margin:14px 0 0;font-size:14px;color:var(--error);overflow-wrap:anywhere}
.feedback{margin-top:24px;padding:13px 15px;background:#fff4f4;border-left:2px solid var(--error);font-size:14px;line-height:1.7}.feedback p{margin:0;overflow-wrap:anywhere}.action{background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:8px 13px;font-size:13px;min-height:38px;margin-top:10px}.action:hover{background:#3a3a3a}.settings-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:auto;padding-top:36px;font:12px/1.5 var(--mono);color:var(--muted)}.save-status{display:flex;align-items:center;gap:7px}.save-status::before{content:"";width:5px;height:5px;background:currentColor}.save-status[data-state=saved]{color:var(--green)}.save-status[data-state=error]{color:var(--error)}.foot-mark{font-size:20px;color:var(--ink)}
@media(min-width:1441px){main{border-left:1px solid var(--ink);border-right:1px solid var(--ink)}}
@media(max-width:809px){.topbar{height:62px;padding:0 22px}.brand{font-size:18px}.topmeta{gap:14px;font-size:11px}main{display:block;min-height:calc(100svh - 62px)}.intro{padding:28px 26px 30px;border-right:0;border-bottom:1px solid var(--ink)}.intro h2{font-size:33px;margin:20px 0 0;letter-spacing:-1.5px}.intro h2 span{display:inline}.intro h2 span+span::before{content:" "}.diagram,.intro-foot{display:none}.settings{padding:28px 26px 28px;min-height:520px}.heading{margin-bottom:27px}.heading h1{font-size:29px}.models{max-height:340px}.settings-foot{padding-top:28px}}
@media(max-width:380px){.topmeta span:first-child{display:none}.intro,.settings{padding-left:20px;padding-right:20px}.intro h2{font-size:29px}.capacity{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
<script src="/settings.js" defer></script>
</head>
<body>
<header class="topbar"><div class="brand"><img class="brand-icon" src="/icon.svg" width="32" height="32" alt="">Final Model</div><div class="topmeta"><span>PI EXTENSION</span><span class="version" id="version"></span></div></header>
<main>
<aside class="intro" aria-label="模型分工预览">
  <div class="eyebrow">THE FINAL WORD</div>
  <h2><span>专注执行。</span><span>从容收尾。</span></h2>
  <div class="diagram">
    <div class="window work"><div class="window-title"><span>01 / WORK</span></div><div class="window-body"><div class="window-label">执行任务</div><div class="model-name" id="working-model">当前模型</div></div></div>
    <div class="connector" aria-hidden="true"></div>
    <div class="window final"><div class="window-title"><span>02 / FINAL</span></div><div class="window-body"><div class="window-label">整理最终答复</div><div class="model-name" id="final-model">选择你的模型</div></div></div>
    <div class="restore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 8H15a6 6 0 0 1 0 12H9M6 8l5-5M6 8l5 5"/></svg><span id="restore-label">完成后，回到工作模型</span></div>
  </div>
  <div class="intro-foot"><span>A → B → A</span><span class="cross" aria-hidden="true">+</span></div>
</aside>
<section class="settings" aria-labelledby="settings-title">
  <div class="heading"><h1 id="settings-title">设置</h1><span class="section-number" aria-hidden="true">[ 01—02 ]</span></div>
  <div class="enable-row"><label for="enabled">使用独立的最终答复模型</label><span class="toggle-wrap"><input id="enabled" type="checkbox" role="switch" disabled><span class="toggle-track" aria-hidden="true"></span></span></div>
  <fieldset><legend>最终答复模型</legend>
    <label class="search" for="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input id="search" type="search" placeholder="搜索模型或提供商" aria-label="搜索模型或提供商" autocomplete="off" disabled></label>
    <div id="models" class="models" role="radiogroup" aria-label="最终答复模型" aria-busy="true"><div class="empty">正在读取模型…</div></div>
    <p id="missing" class="missing" hidden></p>
  </fieldset>
  <div class="feedback" id="feedback" hidden role="alert"><p id="message"></p><button class="action" id="retry" type="button" hidden>重试</button><button class="action" id="recover" type="button" hidden>恢复工作模型</button></div>
  <footer class="settings-foot"><span id="save-status" class="save-status" role="status" aria-live="polite">正在连接…</span><span class="foot-mark" aria-hidden="true">↗</span></footer>
</section>
</main>
</body>
</html>
