<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Final Model · 设置设计原型</title>
<link rel="icon" href="../icon.svg">
<style>
:root{--ink:#1e1e1e;--muted:#68656e;--line:#dad7df;--tint:#f3eff9;--green:#307653;--error:#9b294b;--mono:ui-monospace,"SFMono-Regular",Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}body::before{content:"";position:absolute;inset:0 0 auto;height:min(920px,100svh);background:url('cloud-grain.png') center top/cover no-repeat;z-index:-1;pointer-events:none}button,input{font:inherit;color:inherit}button{cursor:pointer;border-radius:0}button:disabled{cursor:default;opacity:.45}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #7052b1;outline-offset:4px}[hidden]{display:none!important}.icon{width:20px;height:20px;object-fit:contain;flex:none}.topbar{max-width:1256px;margin:auto;padding:23px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;letter-spacing:-.7px;font-weight:650;background:#fff;padding:8px 13px}.brand img{width:27px;height:27px}.topmeta{display:flex;gap:8px;align-items:center}.tag{background:#fff;padding:9px 12px;font-size:14px}.version{font:12px var(--mono);letter-spacing:.04em;background:var(--ink);color:#fff;padding:12px}.hero{max-width:864px;margin:25px auto 32px;padding:0 24px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.hero h1{margin:0;font-size:74px;font-weight:650;letter-spacing:-5px;line-height:1.05}.hero p{font:12px var(--mono);letter-spacing:.04em;background:#ffffffb3;padding:6px 9px;margin:0 0 9px}.settings{max-width:816px;margin:0 auto;background:#fff;border:1px solid var(--ink);box-shadow:4px 4px var(--ink);padding:31px 38px 23px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:23px}.section-head h2{font-size:27px;letter-spacing:-1px;line-height:1.3;margin:0;font-weight:600}.section-head span{font:12px var(--mono);color:var(--muted)}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0 22px;border-bottom:1px solid var(--line)}.setting-row label:first-child{font-size:17px;font-weight:500}.switch{position:relative;display:block;width:44px;height:25px;flex:none}.switch input{position:absolute;inset:0;margin:0;width:100%;height:100%;opacity:0;cursor:pointer}.switch-track{height:25px;width:44px;background:#e7e4eb;border:1px solid #aaa6b2;display:block;pointer-events:none;transition:background 120ms}.switch-track::after{content:"";position:absolute;top:5px;left:5px;width:15px;height:15px;background:#77717f;transition:transform 120ms}.switch input:checked+.switch-track{background:var(--ink);border-color:var(--ink)}.switch input:checked+.switch-track::after{transform:translateX(19px);background:#fff}.switch input:focus-visible+.switch-track{outline:2px solid #7052b1;outline-offset:4px}fieldset{min-width:0;border:0;padding:0;margin:27px 0 0}legend{padding:0;font-size:17px;font-weight:500;margin-bottom:16px}.selected-model{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;gap:18px;min-height:86px;padding:18px;border:1px solid var(--ink);background:var(--tint)}.selected-model:hover{background:#ede5f7}.selected-model .icon{width:19px;height:19px}.selected-model[aria-expanded=true] .icon{transform:rotate(180deg)}.model-copy{min-width:0;flex:1}.model-name{display:block;font-size:18px;font-weight:550}.model-id{display:block;font:12px/1.5 var(--mono);color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.model-chooser{margin-top:12px;padding:10px;border:1px solid var(--line)}.search{display:flex;align-items:center;gap:10px;padding:0 12px;height:44px;border:1px solid #a6a1af;margin-bottom:10px}.search:focus-within{outline:2px solid #7052b1;outline-offset:2px}.search input{background:transparent;border:0;outline:0;width:100%;min-width:0;height:100%;font-size:14px}.search input:focus-visible{outline:0}.search input::placeholder{color:#76707d}.search .icon{width:18px;height:18px}.models{max-height:217px;overflow:auto;scrollbar-width:thin}.model-choice{position:relative;display:flex;align-items:center;gap:14px;padding:13px;min-height:65px;border-bottom:1px solid var(--line);cursor:pointer}.model-choice:hover{background:#f6f3fa}.model-choice:has(input:checked){background:var(--tint)}.model-choice:has(input:focus-visible){outline:2px solid #7052b1;outline-offset:-2px}.model-choice input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}.model-choice .model-name{font-size:15px}.model-choice .model-id{font-size:11px;margin-top:2px}.model-choice .icon{visibility:hidden;width:18px;height:18px}.model-choice:has(input:checked) .icon{visibility:visible}.empty{padding:23px 12px;font-size:15px;color:var(--muted)}.flow{display:flex;align-items:center;gap:21px;margin-top:32px;padding:23px 0;border-top:1px solid var(--line)}.flow-step{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:1;min-width:0;font-size:15px}.flow-step strong{font-weight:500}.flow-step span{font:13px var(--mono);overflow-wrap:anywhere;text-align:right}.flow>.icon{width:20px;height:20px}.feedback{background:#fff4f7;border-left:2px solid var(--error);padding:13px 16px;margin:4px 0 20px;font-size:14px;color:var(--error)}.feedback p{margin:0;line-height:1.7}.feedback button{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:8px 12px;margin:10px 7px 0 0;font-size:14px;min-height:38px}.foot{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:13px;padding-top:17px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}.save{display:flex;align-items:center;gap:7px;color:var(--green)}.save .icon{width:17px;height:17px}.save[data-state=error]{color:var(--error)}.page-foot{max-width:864px;margin:29px auto 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 24px;font-size:14px;color:var(--muted)}.page-foot button{background:transparent;color:inherit;border:0;padding:0;font:inherit;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}dialog{width:540px;max-width:calc(100vw - 32px);border:1px solid var(--ink);padding:0;background:white;box-shadow:5px 5px var(--ink)}dialog::backdrop{background:#2a23374a;backdrop-filter:blur(4px)}.dialog-head{padding:23px 25px 17px;display:flex;align-items:center;justify-content:space-between;gap:15px}.dialog-head h2{font-size:22px;font-weight:550;margin:0;letter-spacing:-.5px}.close{display:grid;place-items:center;border:0;background:transparent;padding:5px}.dialog-body{padding:0 25px 25px}.dialog-body p{margin:0 0 15px;color:var(--muted);font-size:15px;line-height:1.7}.dialog-body strong{color:var(--ink);font-weight:550}.dialog-body p:last-child{margin-bottom:0}.toast{position:fixed;bottom:23px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 17px;font-size:14px;max-width:calc(100vw - 32px);width:max-content;box-shadow:3px 3px #aaa4b1;z-index:10}
@media(max-height:800px) and (min-width:641px){.topbar{padding-top:14px;padding-bottom:14px}.hero{margin-top:12px;margin-bottom:24px}.hero h1{font-size:62px}.settings{padding:26px 34px 21px}.section-head{margin-bottom:18px}.setting-row{padding:15px 0 19px}fieldset{margin-top:23px}legend{margin-bottom:13px}.selected-model{min-height:78px;padding:15px 17px}.flow{margin-top:27px;padding:20px 0}.page-foot{margin-top:27px}}
@media(max-width:900px){.settings{margin-right:28px;margin-left:28px}.hero,.page-foot{padding-left:28px;padding-right:28px}.topbar{padding-left:28px;padding-right:28px}.flow-step{flex-direction:column;align-items:flex-start;gap:4px}.flow-step span{text-align:left}}
@media(max-width:640px){body::before{height:min(650px,100svh);background-size:auto 650px}.topbar{padding:19px 20px;gap:10px}.brand{font-size:18px;padding:7px 10px;gap:8px}.brand img{width:23px;height:23px}.topmeta{gap:6px}.tag{font-size:12px;padding:8px}.version{display:none}.hero{margin-top:27px;margin-bottom:30px;padding:0 22px;gap:12px}.hero h1{font-size:59px;letter-spacing:-3px}.hero p{font-size:9px;letter-spacing:0;padding:5px 7px;margin-bottom:7px}.settings{margin:0 20px;padding:26px 23px 23px}.section-head{margin-bottom:17px}.section-head h2{font-size:24px}.section-head span{font-size:10px}.setting-row{padding-top:14px;padding-bottom:22px;gap:13px}.setting-row label:first-child{font-size:15px}fieldset{margin-top:24px}legend{font-size:15px;margin-bottom:14px}.selected-model{min-height:80px;padding:14px}.model-name{font-size:17px}.model-id{font-size:11px}.flow{gap:12px;margin-top:27px;padding:21px 0}.flow-step{font-size:14px}.flow-step span{font-size:12px}.foot{font-size:13px;gap:10px;margin-top:12px;padding-top:17px}.page-foot{font-size:13px;padding:0 22px;flex-wrap:wrap;gap:10px;margin-top:26px}.model-chooser{padding:8px}.model-choice{padding:11px}.dialog-body,.dialog-head{padding-left:22px;padding-right:22px}.toast{bottom:18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><img src="../icon.svg" alt="">Final Model</div><div class="topmeta"><span class="tag">设计原型</span><span class="version">v0.2.0</span></div></header>
<div class="hero"><h1>设置。</h1><p>THE FINAL WORD.</p></div>
<main class="settings" aria-labelledby="settings-title">
<header class="section-head"><h2 id="settings-title">最终答复</h2><span>01 / FINAL MODEL</span></header>
<div class="setting-row"><label for="enabled">使用独立的最终答复模型</label><label class="switch"><input id="enabled" type="checkbox" role="switch" checked aria-label="使用独立的最终答复模型"><span class="switch-track" aria-hidden="true"></span></label></div>
<fieldset><legend>最终答复模型</legend><button class="selected-model" id="model-open" type="button" aria-expanded="false" aria-controls="model-chooser"><span class="model-copy"><span class="model-name" id="selected-name">GPT-6-Luna</span><span class="model-id" id="selected-id">magpie-groups / codex/gpt-6-luna</span></span><img class="icon" src="icons/chevron-down.svg" alt=""></button><div class="model-chooser" id="model-chooser" hidden><label class="search"><img class="icon" src="icons/search.svg" alt=""><input id="search" type="search" placeholder="搜索模型或提供商" aria-label="搜索模型或提供商" autocomplete="off"></label><div class="models" id="models" role="radiogroup" aria-label="最终答复模型"></div></div></fieldset>
<div class="flow" aria-label="模型分工示例"><div class="flow-step"><strong>执行任务</strong><span>smart</span></div><img class="icon" src="icons/arrow-right.svg" alt="然后"><div class="flow-step"><strong>整理答复</strong><span id="final-model">GPT-6-Luna</span></div></div>
<div class="feedback" id="feedback" hidden role="alert"><p id="error-message"></p><button id="retry" type="button" hidden>重试保存</button><button id="recover" type="button" hidden>恢复整理状态</button></div>
<footer class="foot"><span class="save" id="save-status" role="status" aria-live="polite"><img class="icon" src="icons/check.svg" alt=""><span id="save-text">原型已就绪</span></span><span>示例工作模型 · smart</span></footer>
</main>
<footer class="page-foot"><span>设计原型，改动仅保存在当前浏览器。</span><button id="design-notes" type="button">页面归位方案</button></footer>
<dialog id="notes" aria-labelledby="notes-title"><div class="dialog-head"><h2 id="notes-title">一个页面，完成配置。</h2><button class="close" id="notes-close" type="button" aria-label="关闭"><img class="icon" src="icons/x.svg" alt=""></button></div><div class="dialog-body"><p><strong>设置：</strong>独立最终答复开关、模型搜索和选择。</p><p><strong>预览：</strong>工作模型只读展示，模型分工缩为一行。</p><p><strong>按需出现：</strong>任务状态、保存失败、重试和恢复，不做常驻设置项。</p><p>此稿只包含 Final Model 现有能力，未接入真实 Pi 配置。模型列表与工作模型均为示例。</p></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
const $=id=>document.getElementById(id);
const storageKey='pi-final-model-settings-design-v1';
const models=[{id:'magpie-groups/codex/gpt-6-luna',name:'GPT-6-Luna',label:'magpie-groups / codex/gpt-6-luna'},{id:'magpie-groups/codex/gpt-6-sol',name:'GPT-6-Sol',label:'magpie-groups / codex/gpt-6-sol'},{id:'magpie-groups/codex/gpt-6-astra',name:'GPT-6-Astra',label:'magpie-groups / codex/gpt-6-astra'}];
let state={enabled:true,model:models[0].id};
try{const stored=JSON.parse(localStorage.getItem(storageKey)||'null');if(stored&&typeof stored.enabled==='boolean'&&models.some(model=>model.id===stored.model))state={enabled:stored.enabled,model:stored.model};}catch{}
function feedback(message){$('feedback').hidden=!message;$('error-message').textContent=message;$('retry').hidden=!message;$('recover').hidden=true;}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state));$('save-status').dataset.state='saved';$('save-text').textContent='原型已保存';feedback('');}catch{$('save-status').dataset.state='error';$('save-text').textContent='原型尚未保存';feedback('当前浏览器无法保存原型设置。');}}
function render(){const model=models.find(model=>model.id===state.model);$('enabled').checked=state.enabled;$('selected-name').textContent=model.name;$('selected-id').textContent=model.label;$('final-model').textContent=state.enabled?model.name:'smart';for(const input of $('models').querySelectorAll('input'))input.checked=input.value===state.model;}
function renderModels(){const container=$('models');container.replaceChildren();const query=$('search').value.trim().toLowerCase();const filtered=models.filter(model=>(model.name+' '+model.label).toLowerCase().includes(query));for(const model of filtered){const label=document.createElement('label');label.className='model-choice';const input=document.createElement('input');input.type='radio';input.name='final-model';input.value=model.id;input.checked=model.id===state.model;input.setAttribute('aria-label',model.name);input.onchange=()=>{state.model=model.id;save();render();$('model-chooser').hidden=true;$('model-open').setAttribute('aria-expanded','false');$('model-open').focus();};const copy=document.createElement('span');copy.className='model-copy';const name=document.createElement('span');name.className='model-name';name.textContent=model.name;const id=document.createElement('span');id.className='model-id';id.textContent=model.label;copy.append(name,id);const icon=document.createElement('img');icon.className='icon';icon.src='icons/check.svg';icon.alt='';label.append(input,copy,icon);container.append(label);}if(!filtered.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='没有匹配的模型';container.append(empty);}}
$('enabled').onchange=()=>{state.enabled=$('enabled').checked;save();render();};$('search').oninput=renderModels;$('model-open').onclick=()=>{const opening=$('model-chooser').hidden;$('model-chooser').hidden=!opening;$('model-open').setAttribute('aria-expanded',String(opening));if(opening){$('search').value='';renderModels();$('search').focus();}};$('search').onkeydown=event=>{if(event.key==='Escape'){$('model-chooser').hidden=true;$('model-open').setAttribute('aria-expanded','false');$('model-open').focus();}};$('retry').onclick=save;$('design-notes').onclick=()=>$('notes').showModal();$('notes-close').onclick=()=>$('notes').close();render();
</script>
</body>
</html>
