<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final Model · 三版渐变预览</title><link rel="icon" href="icon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#202022;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}header{display:flex;gap:22px;align-items:center;padding:18px 28px;background:#fff;border-bottom:1px solid #ddd;flex-wrap:wrap}header img{width:30px;height:30px}h1{font-size:17px;margin:0 auto 0 0;font-weight:600}nav{display:flex;gap:6px}button,a{font:inherit;color:inherit}button{border:1px solid transparent;padding:10px 16px;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#202022;color:white}a{padding:8px;text-decoration:none}a:hover{text-decoration:underline}iframe{border:0;width:100%;height:calc(100svh - 78px);display:block;background:white}@media(max-width:650px){header{padding:12px;gap:10px}nav{order:3;width:100%}button{flex:1;padding:10px 5px}iframe{height:calc(100svh - 116px)}}
</style></head><body><header><img src="icon.svg" alt=""><h1>Final Model / 渐变预览</h1><nav aria-label="配色版本"><button data-page="a" aria-pressed="true">01 官网云雾</button><button data-page="b" aria-pressed="false">02 轻雾留白</button><button data-page="c" aria-pressed="false">03 蓝紫暮光</button></nav><a id="full" href="a.html" target="_blank" rel="noopener">完整页面 ↗</a></header><iframe src="a.html" title="设置页配色预览"></iframe><script>
for(const button of document.querySelectorAll('button'))button.onclick=()=>{for(const other of document.querySelectorAll('button'))other.setAttribute('aria-pressed',String(other===button));const page=button.dataset.page+'.html';document.querySelector('iframe').src=page;document.getElementById('full').href=page};
</script></body></html>
